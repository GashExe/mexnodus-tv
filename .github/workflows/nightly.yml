name: Salud de señales IPTV

# Corre aquí y no en Vercel: `vercel.json` capa las rutas API a 30s y el barrido
# completo son decenas de minutos. Actions da 6h.
on:
  # ACTIVO. Una ejecución programada NO es dry-run: sondea las ~20.700 señales
  # (~90 min) y escribe. Se activó tras comprobar que el runner ve lo mismo que
  # una máquina en México (59/28/13 frente a 62/29/9) y que el 403 —el delator del
  # geobloqueo— sale al 6% en ambos.
  #
  # LIMITACIÓN CONOCIDA: desde EE.UU. no se puede evaluar un stream restringido a
  # México (p.ej. `channel01-onlymex.akamaized.net` da 200 desde México y 403
  # aquí). Esos quedan en `unknown` y siguen publicados, que es lo correcto. Para
  # evaluarlos de verdad haría falta sondear desde México (runner autoalojado).
  # CRON EN PAUSA. La regla nueva retira todo canal sin señal viva, y desde un
  # runner en EE.UU. un canal mexicano geobloqueado parece muerto. No se
  # reactiva hasta decidir dónde se ejecuta (ver comparación GitHub vs México).
  # schedule:
  #   - cron: "0 8 * * *" # 08:00 UTC ≈ 02:00 CDMX
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo medir, sin escribir nada"
        type: boolean
        default: true
      limit:
        description: "Muestra a sondear. SOLO se aplica en dry-run; una ejecución real va siempre completa."
        type: string
        default: "200"
      extra_args:
        description: "Argumentos extra para diagnóstico, p.ej. --country MX --json"
        type: string
        default: ""

concurrency:
  # Dos ejecuciones a la vez se pisarían al reordenar prioridades.
  group: nightly-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 como mínimo: @supabase/supabase-js necesita el WebSocket nativo de
          # Node 22+ y con 20 falla al construir el cliente («native WebSocket not
          # found»). Además Actions ya marca Node 20 como deprecado.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sondear y aplicar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # El veredicto de CORS depende de este origen: tiene que ser el dominio
          # REAL desde el que reproduce la app, no localhost.
          PROBE_ORIGIN: ${{ secrets.PROBE_ORIGIN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
            # El límite solo tiene sentido midiendo: una ejecución real va completa
            # para que cada canal se reordene con TODAS sus señales delante.
            if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          fi
          npx tsx scripts/nightly.ts $ARGS ${{ inputs.extra_args }}
