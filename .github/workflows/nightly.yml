name: Salud de señales IPTV

# Corre aquí y no en Vercel: `vercel.json` capa las rutas API a 30s y el barrido
# completo son decenas de minutos. Actions da 6h.
on:
  # ACTIVO con la REGLA ESTRICTA: se retira todo canal sin una sola señal viva.
  #
  # Decisión del usuario con los números delante. Medido señal a señal sobre las
  # mismas 200 señales mexicanas, GitHub y una máquina en México coinciden en el
  # 90%; 15 salen vivas solo desde México (14 de ellas por 403 = geobloqueo) y 2
  # solo desde GitHub. Coste asumido: ~13 canales mexicanos vivos que este runner
  # no puede ver y retirará. Se acepta a cambio de cero mantenimiento.
  #
  # Se recupera solo: las señales de un canal retirado se siguen sondeando cada
  # noche (retirar el canal no desactiva sus señales), y en cuanto una responda
  # `online` el canal vuelve — `reactivateRecovered` solo toca los que este job
  # apagó, así que nunca resucita los duplicados de la fusión.
  #
  # Para recuperar los geobloqueados en cualquier momento, basta con lanzarlo
  # desde México: `npm run nightly -- --origin https://www.mxndustv.xyz`
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC ≈ 02:00 CDMX, tráfico mínimo
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo medir, sin escribir nada"
        type: boolean
        default: true
      limit:
        description: "Muestra a sondear. SOLO se aplica en dry-run; una ejecución real va siempre completa."
        type: string
        default: "200"
      extra_args:
        description: "Argumentos extra para diagnóstico, p.ej. --country MX --json"
        type: string
        default: ""

concurrency:
  # Dos ejecuciones a la vez se pisarían al reordenar prioridades.
  group: nightly-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 como mínimo: @supabase/supabase-js necesita el WebSocket nativo de
          # Node 22+ y con 20 falla al construir el cliente («native WebSocket not
          # found»). Además Actions ya marca Node 20 como deprecado.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sondear y aplicar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # El veredicto de CORS depende de este origen: tiene que ser el dominio
          # REAL desde el que reproduce la app, no localhost.
          PROBE_ORIGIN: ${{ secrets.PROBE_ORIGIN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
            # El límite solo tiene sentido midiendo: una ejecución real va completa
            # para que cada canal se reordene con TODAS sus señales delante.
            if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          fi
          npx tsx scripts/nightly.ts $ARGS ${{ inputs.extra_args }}
